name: Release

# The release workflow is shared by every KS-Suite Kotlin app and lives in ks-utility
# (https://github.com/kumasumit/ks-utility/blob/main/specs/release-workflow.md).
# This file only names KS Expense Manager's platforms.
#
#   Tag push android-vX.Y.Z       Builds and verifies the signed APK and AAB, then publishes the
#                                 GitHub Release (full release, not marked latest). This app's
#                                 normal release tag: it has one platform (suite rule).
#   Tag push vX.Y.Z               The same, marked latest. Used once, for the v0.1.1 bridge release.
#   Manual run (rehearsal)        Builds and checks everything for the version given; never publishes.

on:
  push:
    tags: ["v*.*.*", "*-v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, X.Y.Z. Builds everything, releases nothing."
        required: true
        type: string
      platform:
        description: "Platform to rehearse, as its tag would build it."
        required: false
        default: android
        type: choice
        options: [android, all]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: kumasumit/ks-utility/.github/workflows/kotlin-app-release.yml@v0.16.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      version: ${{ inputs.version }}
      platform: ${{ inputs.platform || 'all' }}
      app-name: ks-expense-manager
      display-name: KS Expense Manager
      # Phone only: no tv-module, no desktop modules (specs/plan.md).
      android-module: ":mobile:android"
      play-build-type: "play"             # the AAB is the Google Play build (no releases link)
      test-tasks: ":mobile:android:testDebugUnitTest :mobile:android:checkLanguageFiles :mobile:android:checkNoInternetRelease :mobile:android:checkNoInternetPlay"
    secrets: inherit
