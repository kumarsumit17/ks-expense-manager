name: Move to the newest ks-utility

# ks-utility's bump workflow (https://github.com/kumasumit/ks-utility/blob/main/specs/release-workflow.md):
# moves the ks-utility submodule to the newest tag, runs the tests, and only then commits
# "chore: move ks-utility to vX.Y.Z" to dev. Started by ks-utility's release notice, daily, or by hand.
on:
  repository_dispatch:
    types: [ks-utility-released]
  schedule:
    - cron: "17 4 * * *"   # daily, in case a notice was missed
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    permissions: { contents: write, issues: write }
    uses: kumasumit/ks-utility/.github/workflows/ks-utility-bump.yml@v0.17.0
    with:
      kind: kotlin
      java: true
      test: ./gradlew :mobile:android:testDebugUnitTest :mobile:android:checkLanguageFiles
